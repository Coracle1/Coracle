<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: black; /* ✅ background image removed */
      color: white;
    }

    /* ✅ NEW: full-width image */
    .hero-bg {
      width: 100%;
      height: auto;
      display: block;
    }

    header {
      width: 100%;
      padding: 20px 270px 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      z-index: 30;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .dropdown {
      position: relative;
    }

    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: #7fd1c8;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      position: relative;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav-button:hover {
      color: #ffffff;
      text-shadow: 0 0 6px rgba(127, 209, 200, 0.6);
    }

    .nav-button.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(127, 209, 200, 0.85);
    }

    .nav-button::after {
      content: "";
      position: absolute;
      left: 10%;
      bottom: -2px;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #ff7a18, #ffb347);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .nav-button:hover::after,
    .nav-button.active::after {
      width: 80%;
    }

    .contact-panel {
      position: absolute;
      top: 42px;
      right: 0;
      width: 260px;
      background: rgba(20, 30, 40, 0.96);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px;
      display: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      z-index: 1000;
    }

    .contact-panel.open {
      display: block;
    }

    .contact-panel h3 {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .contact-panel p {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ddd;
      line-height: 1.5;
    }

    .contact-panel a {
      display: block;
      color: white;
      text-decoration: none;
      font-weight: 600;
      margin-top: 8px;
    }

    .contact-panel a:hover {
      text-decoration: underline;
    }

    .hero-spacer {
      min-height: calc(100vh - 80px);
    }

    .legal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }

    .legal-overlay.open {
      display: flex;
    }

    .legal-modal {
      width: min(980px, 100%);
      max-height: 88vh;
      background: rgba(12, 18, 24, 0.96);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .legal-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .legal-modal-header h2 {
      font-family: "Orbitron", sans-serif;
      font-size: 18px;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .close-button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.16);
      color: #7fd1c8;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .close-button:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.28);
    }

    .legal-tabs {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
    }

    .legal-tab {
      background: rgba(127, 209, 200, 0.08);
      border: 1px solid rgba(127, 209, 200, 0.18);
      color: #7fd1c8;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .legal-tab:hover {
      background: rgba(127, 209, 200, 0.14);
      color: #fff;
    }

    .legal-tab.active {
      background: linear-gradient(90deg, rgba(255,122,24,0.18), rgba(255,179,71,0.18));
      border-color: rgba(255,179,71,0.35);
      color: #fff;
    }

    .legal-body {
      padding: 20px;
      overflow-y: auto;
      line-height: 1.7;
    }

    .legal-section {
      display: none;
    }

    .legal-section.active {
      display: block;
    }

    .legal-section h3 {
      margin: 0 0 10px;
      font-size: 30px;
      color: #fff;
    }

    .legal-section h4 {
      margin: 22px 0 8px;
      font-size: 18px;
      color: #fff;
    }

    .legal-section p {
      margin-bottom: 12px;
      color: #ddd;
    }

    .legal-section ul {
      margin: 0 0 12px 22px;
      color: #ddd;
    }

    .legal-section a {
      color: #7fd1c8;
    }

    .muted {
      color: #cfcfcf;
    }

    @media (max-width: 768px) {
      header {
        justify-content: center;
        padding: 16px;
      }

      nav ul {
        gap: 12px;
        flex-wrap: wrap;
      }

      .legal-overlay {
        padding: 12px;
      }

      .legal-modal {
        max-height: 92vh;
      }

      .legal-section h3 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ✅ NEW image -->
  <img src="newappweb.png" class="hero-bg" alt="">

  <!-- everything else unchanged -->

</body>
</html>
