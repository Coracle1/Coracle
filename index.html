<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: url("Newappweb.png") no-repeat center center fixed;
      background-size: contain;
      background-color: black;
      color: white;
    }

    header {
      width: 100%;
      /* ✅ UPDATED HERE */
      padding: 20px 270px 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      z-index: 30;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .dropdown {
      position: relative;
    }

    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: #7fd1c8;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      position: relative;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav-button:hover {
      color: #ffffff;
      text-shadow: 0 0 6px rgba(127, 209, 200, 0.6);
    }

    .nav-button.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(127, 209, 200, 0.85);
    }

    .nav-button::after {
      content: "";
      position: absolute;
      left: 10%;
      bottom: -2px;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #ff7a18, #ffb347);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .nav-button:hover::after,
    .nav-button.active::after {
      width: 80%;
    }

    .contact-panel {
      position: absolute;
      top: 42px;
      right: 0;
      width: 260px;
      background: rgba(20, 30, 40, 0.96);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px;
      display: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      z-index: 1000;
    }

    .contact-panel.open {
      display: block;
    }

    .hero-spacer {
      min-height: calc(100vh - 80px);
    }

    /* Legal modal unchanged */
    .legal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }

    .legal-overlay.open {
      display: flex;
    }

    .legal-modal {
      width: min(980px, 100%);
      max-height: 88vh;
      background: rgba(12, 18, 24, 0.96);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

  </style>
</head>

<body>

<header>
  <nav>
    <ul>
      <li class="dropdown">
        <button class="nav-button" id="contactBtn">Contact</button>
        <div class="contact-panel" id="contactPanel">
          <p>For enquiries or feedback, please get in touch by email.</p>
          <a href="mailto:coracle1@btinternet.com">coracle1@btinternet.com</a>
        </div>
      </li>

      <li class="dropdown">
        <button class="nav-button" id="legalBtn">Legal</button>
      </li>
    </ul>
  </nav>
</header>

<div class="hero-spacer"></div>

<script>
  const contactBtn = document.getElementById("contactBtn");
  const contactPanel = document.getElementById("contactPanel");

  function closeContact() {
    contactPanel.classList.remove("open");
    contactBtn.classList.remove("active");
  }

  function openContact() {
    contactPanel.classList.add("open");
    contactBtn.classList.add("active");
  }

  contactBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    const isOpen = contactPanel.classList.contains("open");
    closeContact();
    if (!isOpen) openContact();
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".dropdown")) {
      closeContact();
    }
  });
</script>

</body>
</html>
