<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
    }

    .hero-image-wrap {
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .hero-bg {
      width: 100%;
      height: auto;
      display: block;
    }

    header {
      width: 100%;
      padding: 20px 270px 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .dropdown {
      position: relative;
    }

    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: #7fd1c8;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .nav-button:hover,
    .nav-button.active {
      color: #ffffff;
    }

    .contact-panel {
      position: absolute;
      top: 42px;
      right: 0;
      width: 260px;
      background: rgba(20, 30, 40, 0.96);
      border-radius: 12px;
      padding: 14px;
      display: none;
      z-index: 1000;
    }

    .contact-panel.open {
      display: block;
    }

    .contact-panel a,
    .contact-panel a:visited,
    .contact-panel a:hover {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .legal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }

    .legal-overlay.open {
      display: flex;
    }

    .legal-modal {
      width: min(980px, 100%);
      max-height: 88vh;
      background: rgba(12, 18, 24, 0.96);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .legal-tabs {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      flex-wrap: wrap;
    }

    .legal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .legal-section {
      display: none;
    }

    .legal-section.active {
      display: block;
    }

    /* ===== MOBILE ===== */

    @media (max-width: 768px) {
      .hero-bg {
        width: 100%;
        height: 85vh;
        object-fit: cover;
        object-position: center top;
      }

      header {
        top: auto;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        padding: 0;
        justify-content: center;
      }

      header::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        border-radius: 999px;
        z-index: -1;
      }

      nav ul {
        gap: 8px;
        flex-wrap: nowrap;
        padding: 8px 14px;
      }

      .nav-button {
        font-size: 13px;
        padding: 6px 10px;
      }

      .contact-panel {
        top: auto;
        bottom: 52px;
        right: 50%;
        transform: translateX(50%);
        width: min(260px, 90vw);
      }

      .legal-modal {
        width: 100%;
        max-height: 92vh;
      }

      .legal-body {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="hero-image-wrap">
    <img src="newappweb4.png" class="hero-bg" alt="Coracle">

    <header>
      <nav>
        <ul>
          <li class="dropdown">
            <button class="nav-button" id="contactBtn">Contact</button>
            <div class="contact-panel" id="contactPanel">
              <a href="mailto:coracle1@btinternet.com">coracle1@btinternet.com</a>
            </div>
          </li>

          <li class="dropdown">
            <button class="nav-button" id="legalBtn">Legal</button>
          </li>
        </ul>
      </nav>
    </header>
  </div>

  <div class="legal-overlay" id="legalOverlay">
    <div class="legal-modal">
      <div class="legal-tabs">
        <button id="privacyTab">Privacy</button>
        <button id="termsTab">Terms</button>
      </div>

      <div class="legal-body">
        <section id="privacySection" class="legal-section active">
          <h3>Privacy</h3>
          <p>Privacy content here...</p>
        </section>

        <section id="termsSection" class="legal-section">
          <h3>Terms</h3>
          <p>Terms content here...</p>
        </section>
      </div>
    </div>
  </div>

  <script>
    const contactBtn = document.getElementById("contactBtn");
    const contactPanel = document.getElementById("contactPanel");
    const legalBtn = document.getElementById("legalBtn");
    const legalOverlay = document.getElementById("legalOverlay");

    contactBtn.onclick = () => {
      contactPanel.classList.toggle("open");
    };

    legalBtn.onclick = () => {
      legalOverlay.classList.toggle("open");
    };
  </script>

</body>
</html>
