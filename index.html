<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
    }

    body { position: relative; }

    .hero-image-wrap {
      width: 100%;
      position: relative;
      background: black;
      overflow: hidden;
    }

    .hero-bg-desktop, .hero-bg-mobile {
      width: 100%;
      display: block;
      height: auto;
    }

    .hero-bg-mobile { display: none; }

    header {
      width: 100%;
      padding: 20px 270px 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .dropdown { position: relative; }

    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: #7fd1c8;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      position: relative;
    }

    .nav-button.active { color: #ffffff; }

    .contact-panel {
      position: absolute;
      top: 42px;
      right: 0;
      width: 260px;
      background: rgba(20, 30, 40, 0.96);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px;
      display: none;
      z-index: 1000;
    }

    .contact-panel.open { display: block; }

    .legal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .legal-overlay.open { display: flex; }

    .legal-modal {
      width: min(980px, 100%);
      max-height: 88vh;
      background: rgba(12, 18, 24, 0.96);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
    }

    .legal-tabs { display: flex; gap: 10px; padding: 14px; }

    .legal-tab.active { color: #fff; }

    .legal-section { display: none; }
    .legal-section.active { display: block; }
  </style>
</head>

<body>

<div class="hero-image-wrap">
  <img src="newappweb4.png" class="hero-bg-desktop">
  <img src="mobileweb.png" class="hero-bg-mobile">

  <header>
    <nav>
      <ul>
        <li class="dropdown" id="contactDropdown">
          <button class="nav-button" id="contactBtn">Contact</button>
          <div class="contact-panel" id="contactPanel">
            <p>Email:</p>
            <a href="mailto:coracle1@btinternet.com">coracle1@btinternet.com</a>
          </div>
        </li>

        <li class="dropdown" id="legalDropdown">
          <button class="nav-button" id="legalBtn">Legal</button>
        </li>
      </ul>
    </nav>
  </header>
</div>

<div class="legal-overlay" id="legalOverlay">
  <div class="legal-modal" id="legalModal">
    <button id="closeLegalBtn">Close</button>

    <div class="legal-tabs">
      <button class="legal-tab active" id="privacyTab">Privacy</button>
      <button class="legal-tab" id="termsTab">Terms</button>
    </div>

    <div>
      <section class="legal-section active" id="privacySection">
        Privacy content
      </section>

      <section class="legal-section" id="termsSection">
        Terms content
      </section>
    </div>
  </div>
</div>

<script>
const contactBtn = document.getElementById("contactBtn");
const contactPanel = document.getElementById("contactPanel");
const contactDropdown = document.getElementById("contactDropdown");

const legalBtn = document.getElementById("legalBtn");
const legalOverlay = document.getElementById("legalOverlay");
const legalModal = document.getElementById("legalModal");

const privacyTab = document.getElementById("privacyTab");
const termsTab = document.getElementById("termsTab");
const privacySection = document.getElementById("privacySection");
const termsSection = document.getElementById("termsSection");

function openContact() {
  contactPanel.classList.add("open");
}
function closeContact() {
  contactPanel.classList.remove("open");
}

function openLegal() {
  legalOverlay.classList.add("open");
}
function closeLegal() {
  legalOverlay.classList.remove("open");
}

function showPrivacy() {
  privacyTab.classList.add("active");
  termsTab.classList.remove("active");
  privacySection.classList.add("active");
  termsSection.classList.remove("active");
}

function showTerms() {
  termsTab.classList.add("active");
  privacyTab.classList.remove("active");
  termsSection.classList.add("active");
  privacySection.classList.remove("active");
}

/* FIX: only contact uses hover */
if (window.innerWidth > 1024) {
  contactDropdown.addEventListener("mouseenter", openContact);
  contactDropdown.addEventListener("mouseleave", closeContact);
}

contactBtn.addEventListener("click", openContact);
legalBtn.addEventListener("click", openLegal);

privacyTab.addEventListener("click", showPrivacy);
termsTab.addEventListener("click", showTerms);

document.getElementById("closeLegalBtn").addEventListener("click", closeLegal);

legalOverlay.addEventListener("click", (e) => {
  if (!legalModal.contains(e.target)) closeLegal();
});
</script>

</body>
</html>
