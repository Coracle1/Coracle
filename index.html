<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Orbitron Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: url("Newappweb.png") no-repeat center center fixed;
      background-size: contain;
      background-color: black;
      color: white;
    }

    /* HEADER */
    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: relative;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    /* NAV BUTTONS (Orbitron) */
    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: white;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* DROPDOWN */
    .dropdown {
      position: relative;
    }

    .panel {
      position: absolute;
      top: 40px;
      right: 0;
      background: rgba(20, 30, 40, 0.95);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 14px;
      width: 260px;
      display: none;
      backdrop-filter: blur(6px);
    }

    .panel.open {
      display: block;
    }

    .panel h3 {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .panel p {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ddd;
    }

    .panel a {
      display: block;
      color: #7fd1c8;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .panel a:hover {
      text-decoration: underline;
    }

    /* HEADER OVERLAY */
    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    @media (max-width: 768px) {
      header {
        justify-content: center;
        padding: 16px;
      }

      nav ul {
        gap: 12px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <ul>

      <!-- CONTACT FIRST -->
      <li class="dropdown">
        <button class="nav-button" id="contactBtn">Contact</button>

        <div class="panel" id="contactPanel">
          <h3>Contact Coracle</h3>
          <p>For enquiries or feedback, please get in touch by email.</p>

          <a href="mailto:coracle1@btinternet.com?subject=Enquiry%20from%20Coracle%20website">
            coracle1@btinternet.com
          </a>
        </div>
      </li>

      <!-- LEGAL SECOND -->
      <li class="dropdown">
        <button class="nav-button" id="legalBtn">Legal</button>

        <div class="panel" id="legalPanel">
          <h3>Legal</h3>

          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </div>
      </li>

    </ul>
  </nav>
</header>

<script>
  const contactBtn = document.getElementById("contactBtn");
  const contactPanel = document.getElementById("contactPanel");

  const legalBtn = document.getElementById("legalBtn");
  const legalPanel = document.getElementById("legalPanel");

  contactBtn.onclick = (e) => {
    e.stopPropagation();
    contactPanel.classList.toggle("open");
    legalPanel.classList.remove("open");
  };

  legalBtn.onclick = (e) => {
    e.stopPropagation();
    legalPanel.classList.toggle("open");
    contactPanel.classList.remove("open");
  };

  document.addEventListener("click", () => {
    contactPanel.classList.remove("open");
    legalPanel.classList.remove("open");
  });
</script>

</body>
</html>
