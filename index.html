<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coracle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Orbitron Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-deep: #020814;
            --blue-core: rgb(0, 110, 190);
            --blue-glow: rgb(0, 162, 255);
            --blue-aqua: rgb(0, 180, 255);
            --orange-soft: rgba(255, 180, 70, 0.15);
            --text-light: #E6E6E6;
            --text-mid: #A8A8A8;
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: var(--navy-deep);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ------------------------------------
           LEFT SIDEBAR (TEXT ONLY)
        ------------------------------------ */
        .sidebar {
            width: 240px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 10;
        }

        .sidebar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--blue-aqua);
            text-align: center;
            margin-bottom: 1rem;
        }

        .nav-item {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-mid);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-light);
        }

        /* ------------------------------------
           BACKGROUND GLOW + WAVES
        ------------------------------------ */
        .background {
            position: absolute;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(circle at 50% 40%, var(--blue-core) 0%, transparent 55%),
                radial-gradient(circle at 50% 40%, var(--blue-glow) 0%, transparent 70%),
                radial-gradient(circle at 50% 40%, var(--orange-soft) 0%, transparent 85%),
                var(--navy-deep);
            filter: blur(40px);
        }

        .waves {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(0,110,190,0.25), transparent 70%),
                radial-gradient(ellipse at 50% -20%, rgba(0,162,255,0.18), transparent 70%),
                radial-gradient(ellipse at 20% 50%, rgba(0,180,255,0.15), transparent 70%),
                radial-gradient(ellipse at 80% 50%, rgba(0,110,190,0.15), transparent 70%);
            filter: blur(60px);
            opacity: 0.75;
        }

        /* ------------------------------------
           CENTRAL METALLIC RING + LOGO
        ------------------------------------ */
        .center-ring {
            position: absolute;
            top: 50%;
            left: calc(240px + 40%);
            transform: translate(-50%, -50%);
            width: 650px;
            height: 650px;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(0,162,255,0.35), transparent 70%),
                radial-gradient(circle, rgba(0,110,190,0.25), transparent 80%);
            filter: blur(40px);
            z-index: -1;
        }

        .logo {
            position: absolute;
            top: 50%;
            left: calc(240px + 40%);
            transform: translate(-50%, -50%);
            width: 360px;
            filter:
                drop-shadow(0 0 25px rgba(0,162,255,0.45))
                drop-shadow(0 0 35px rgba(0,110,190,0.35));
        }

    </style>
</head>

<body>

    <div class="background"></div>
    <div class="waves"></div>

    <div class="sidebar">
        <h1>Coracle</h1>

        <div class="nav-item">Home</div>
        <div class="nav-item">About</div>
        <div class="nav-item">Contact</div>
    </div>

    <div class="center-ring"></div>
    <img src="Businesslogo.png" class="logo" alt="Coracle logo">

</body>
</html>
