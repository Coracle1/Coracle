<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: url("Newappweb.png") no-repeat center center fixed;
      
      /* FIXED BACKGROUND SCALING */
      background-size: contain; /* shows full image instead of zooming */
      background-color: black; /* fills empty space nicely */

      color: white;
    }

    /* Top navigation */
    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    nav a:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Optional: make nav readable over image */
    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    @media (max-width: 768px) {
      header {
        justify-content: center;
        padding: 16px;
      }

      nav ul {
        gap: 12px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="privacy.html">Privacy</a></li>
        <li><a href="terms.html">Terms</a></li>
      </ul>
    </nav>
  </header>
</body>
</html>
