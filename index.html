<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coracle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Orbitron Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-deep: #020814;
            --blue-core: rgb(0, 110, 190);
            --blue-glow: rgb(0, 162, 255);
            --blue-aqua: rgb(0, 180, 255);
            --orange-soft: rgba(255, 180, 70, 0.15);
            --text-light: #E6E6E6;
            --text-mid: #A8A8A8;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: var(--navy-deep);
            color: var(--text-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ------------------------------------
           SIDEBAR
        ------------------------------------ */
        .sidebar {
            width: 220px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .sidebar h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            color: var(--blue-aqua);
            margin-bottom: 1rem;
        }

        .nav-item {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-mid);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-light);
        }

        /* ------------------------------------
           BACKGROUND GLOW + WAVES
        ------------------------------------ */
        .background {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 50% 40%, var(--blue-core) 0%, transparent 55%),
                radial-gradient(circle at 50% 40%, var(--blue-glow) 0%, transparent 70%),
                radial-gradient(circle at 50% 40%, var(--orange-soft) 0%, transparent 85%),
                var(--navy-deep);
            filter: blur(40px);
        }

        .waves {
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(0,110,190,0.25), transparent 70%),
                radial-gradient(ellipse at 50% -20%, rgba(0,162,255,0.18), transparent 70%);
            filter: blur(60px);
            opacity: 0.7;
        }

        /* ------------------------------------
           MAIN CONTENT AREA
        ------------------------------------ */
        .main {
            flex: 1;
            padding: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-panel {
            width: 480px;
            padding: 2rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        .glass-panel h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--blue-aqua);
            margin-bottom: 1rem;
        }

        .glass-panel p {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-mid);
        }

        /* ------------------------------------
           LOGO AREA (CENTER GLOW)
        ------------------------------------ */
        .logo-container {
            position: absolute;
            top: 50%;
            left: calc(220px + 50%);
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .logo-container img {
            width: 360px;
            filter:
                drop-shadow(0 0 25px rgba(0,162,255,0.45))
                drop-shadow(0 0 35px rgba(0,110,190,0.35));
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="waves"></div>

    <div class="sidebar">
        <h1>Coracle</h1>
        <div class="nav-item">Home</div>
        <div class="nav-item">About</div>
        <div class="nav-item">Contact</div>
    </div>

    <div class="logo-container">
        <img src="Businesslogo.png" alt="Coracle logo">
    </div>

    <div class="main">
        <div class="glass-panel">
            <h2>A new app is coming soon</h2>
            <p>
                We’re building something designed to make travel simpler, clearer, and more connected.
                Stay tuned — Coracle’s new app is on the horizon.
            </p>
        </div>
    </div>

</body>
</html>
