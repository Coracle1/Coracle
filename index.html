<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Orbitron -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: url("Newappweb.png") no-repeat center center fixed;
      background-size: contain;
      background-color: black;
      color: white;
    }

    header {
      width: 100%;
      padding: 20px 120px 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: relative;
    }

    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: #7fd1c8;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      position: relative;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav-button:hover {
      color: #ffffff;
      text-shadow: 0 0 6px rgba(127, 209, 200, 0.6);
    }

    .nav-button.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(127, 209, 200, 0.85);
    }

    .nav-button::after {
      content: "";
      position: absolute;
      left: 10%;
      bottom: -2px;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #ff7a18, #ffb347);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .nav-button:hover::after,
    .nav-button.active::after {
      width: 80%;
    }

    .dropdown {
      position: relative;
    }

    .panel {
      position: absolute;
      top: 42px;
      right: 0;
      background: rgba(20, 30, 40, 0.95);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 14px;
      width: 260px;
      display: none;
      backdrop-filter: blur(6px);
      transform: translateY(-8px);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 1000;
    }

    .panel.open {
      display: block;
      transform: translateY(0);
      opacity: 1;
    }

    .panel h3 {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .panel p {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ddd;
      line-height: 1.5;
    }

    .panel a {
      display: block;
      color: #7fd1c8;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .panel a:last-child {
      margin-bottom: 0;
    }

    .panel a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      header {
        justify-content: center;
        padding: 16px;
      }

      nav ul {
        gap: 12px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <ul>
      <li class="dropdown">
        <button class="nav-button" id="contactBtn" type="button">Contact</button>
        <div class="panel" id="contactPanel">
          <h3>Contact Coracle</h3>
          <p>For enquiries or feedback, please get in touch by email.</p>
          <a href="mailto:coracle1@btinternet.com?subject=Enquiry%20from%20Coracle%20website">
            coracle1@btinternet.com
          </a>
        </div>
      </li>

      <li class="dropdown">
        <button class="nav-button" id="legalBtn" type="button">Legal</button>
        <div class="panel" id="legalPanel">
          <h3>Legal</h3>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </div>
      </li>
    </ul>
  </nav>
</header>

<script>
  const contactBtn = document.getElementById("contactBtn");
  const contactPanel = document.getElementById("contactPanel");

  const legalBtn = document.getElementById("legalBtn");
  const legalPanel = document.getElementById("legalPanel");

  function closeAll() {
    contactPanel.classList.remove("open");
    legalPanel.classList.remove("open");
    contactBtn.classList.remove("active");
    legalBtn.classList.remove("active");
  }

  contactBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = contactPanel.classList.contains("open");
    closeAll();
    if (!isOpen) {
      contactPanel.classList.add("open");
      contactBtn.classList.add("active");
    }
  });

  legalBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = legalPanel.classList.contains("open");
    closeAll();
    if (!isOpen) {
      legalPanel.classList.add("open");
      legalBtn.classList.add("active");
    }
  });

  contactPanel.addEventListener("click", (e) => {
    e.stopPropagation();
  });

  legalPanel.addEventListener("click", (e) => {
    e.stopPropagation();
  });

  document.addEventListener("click", () => {
    closeAll();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeAll();
    }
  });
</script>

</body>
</html>
