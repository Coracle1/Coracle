<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle – New App Coming Soon</title>

  <!-- Orbitron font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root {
      --navy: rgb(3, 10, 30);
      --blue: rgb(0, 153, 255);
      --orange: rgb(255, 140, 0);
      --text-main: rgb(230, 240, 255);
      --text-muted: rgb(160, 180, 210);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(0,153,255,0.35), transparent 55%),
        radial-gradient(circle at 80% 100%, rgba(255,140,0,0.25), transparent 55%),
        radial-gradient(circle at 10% 80%, rgba(0,153,255,0.25), transparent 55%),
        var(--navy);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        conic-gradient(from 120deg,
          rgba(0,153,255,0.0) 0deg,
          rgba(0,153,255,0.5) 80deg,
          rgba(255,140,0,0.4) 160deg,
          rgba(3,10,30,0.0) 260deg);
      mix-blend-mode: screen;
      opacity: 0.18;
      filter: blur(40px);
      pointer-events: none;
      z-index: -1;
    }

    body::after {
      transform: rotate(180deg);
      opacity: 0.22;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 20%, var(--orange), transparent 55%),
        radial-gradient(circle at 70% 80%, var(--blue), transparent 55%);
      box-shadow:
        0 0 12px rgba(0,153,255,0.7),
        0 0 20px rgba(255,140,0,0.6);
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: "";
      position: absolute;
      inset: 55% -40%;
      background: linear-gradient(to right,
        rgba(0,153,255,0.0),
        rgba(0,153,255,0.7),
        rgba(0,153,255,0.0));
      transform: rotate(-8deg);
      opacity: 0.9;
    }

    .logo-text {
      font-weight: 700;
      letter-spacing: 0.18em;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.2s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      transition: width 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* HERO */
    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 40px;
      padding: 40px 0;
    }

    .hero-kicker {
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: clamp(2.4rem, 3vw + 1.4rem, 3.4rem);
      line-height: 1.1;
      margin-bottom: 16px;
      text-shadow:
        0 0 18px rgba(0,153,255,0.7),
        0 0 28px rgba(0,153,255,0.4);
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 420px;
      line-height: 1.6;
    }

    /* PHONE MOCKUP */
    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .orbital-ring {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(0,153,255,0.5), transparent 60%),
        conic-gradient(from 210deg,
          rgba(255,140,0,0.0) 0deg,
          rgba(255,140,0,0.7) 80deg,
          rgba(0,153,255,0.8) 200deg,
          rgba(3,10,30,0.0) 300deg);
      filter: blur(6px);
      opacity: 0.7;
      box-shadow:
        0 0 40px rgba(0,153,255,0.7),
        0 0 60px rgba(255,140,0,0.5);
    }

    .phone {
      width: 220px;
      height: 440px;
      border-radius: 32px;
      padding: 14px;
      background: linear-gradient(145deg,
        rgba(255,255,255,0.12),
        rgba(0,0,0,0.55));
      box-shadow:
        0 18px 40px rgba(0,0,0,0.7),
        0 0 30px rgba(0,153,255,0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,140,0,0.9), transparent 55%),
        radial-gradient(circle at 70% 80%, rgba(0,153,255,0.9), transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(3,10,30,0.9), rgba(3,10,30,1) 60%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 20%, var(--orange), transparent 55%),
        radial-gradient(circle at 70% 80%, var(--blue), transparent 55%);
      box-shadow:
        0 0 18px rgba(0,153,255,0.8),
        0 0 26px rgba(255,140,0,0.7);
      position: relative;
      overflow: hidden;
    }

    .phone-logo::after {
      content: "";
      position: absolute;
      inset: 60% -40%;
      background: linear-gradient(to right,
        rgba(0,153,255,0.0),
        rgba(0,153,255,0.8),
        rgba(0,153,255,0.0));
      transform: rotate(-10deg);
      opacity: 0.9;
    }

    /* FOOTER */
    footer {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
      margin-top: 20px;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text-main);
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .hero-visual {
        order: -1;
        margin-bottom: 20px;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 16px;
      }
      .nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      footer {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="nav">
      <div class="nav-left">
        <div class="logo-mark"></div>
        <div class="logo-text">CORACLE</div>
      </div>

      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Get in touch</a>
        <a href="#privacy">Privacy policy</a>
      </nav>
    </header>

    <main class="hero" id="home">
      <section>
        <div class="hero-kicker">New app coming soon</div>
        <h1 class="hero-title">Stay tuned for our innovative new app.</h1>
        <p class="hero-subtitle">
          We’re crafting a next‑generation experience for seamless journeys across sea and sky—designed with precision, clarity, and calm.
        </p>
      </section>

      <section class="hero-visual">
        <div class="orbital-ring"></div>
        <div class="phone">
          <div class="phone-screen">
            <div class="phone-logo"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>© 2024 CORACLE. All rights reserved.</span>
      <a href="#privacy">Privacy Policy</a>
    </footer>

  </div>
</body>
</html>
