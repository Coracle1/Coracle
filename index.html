<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coracle</title>

    <!-- Orbitron Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ------------------------------------
           TRUE CORACLE BRAND COLOURS (RGB)
        ------------------------------------ */
        :root {
            /* Metallic Blues */
            --blue-highlight: rgb(0, 162, 255);
            --blue-mid: rgb(0, 110, 190);
            --blue-deep: rgb(0, 55, 120);

            /* Chrome / Silver */
            --silver-bright: rgb(230, 230, 230);
            --silver-mid: rgb(170, 170, 170);
            --silver-dark: rgb(90, 90, 90);

            /* Orange Dome */
            --orange-bright: rgb(255, 180, 70);
            --orange-mid: rgb(240, 130, 0);
            --orange-deep: rgb(200, 90, 0);

            /* Inner Bowl Blues */
            --inner-blue-highlight: rgb(0, 180, 255);
            --inner-blue-mid: rgb(0, 120, 200);
            --inner-blue-shadow: rgb(0, 70, 150);

            /* Averaged Palette */
            --metallic-blue: #006EBE;
            --deep-blue: #003778;
            --highlight-blue: #00A2FF;
            --bright-orange: #FFB446;
            --deep-orange: #C85A00;

            /* Text */
            --text-light: #E6E6E6;
            --text-mid: #AAAAAA;

            /* Glass */
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.18);
        }

        /* ------------------------------------
           GLOBAL
        ------------------------------------ */
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            color: var(--text-light);
            background:
                radial-gradient(circle at 50% -10%, rgba(255,180,70,0.35), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(0,162,255,0.25), transparent 70%),
                linear-gradient(160deg, var(--deep-blue), #000000 70%);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ------------------------------------
           HERO SECTION — WAVE-FLOW + ORANGE BLOOM
        ------------------------------------ */
        .hero {
            position: relative;
            padding: 7rem 1rem 5rem;
            text-align: center;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 1600px;
            height: 1200px;

            background:
                /* Orange dome bloom */
                radial-gradient(circle at 50% 30%, rgba(255,180,70,0.55), transparent 65%),
                radial-gradient(circle at 50% 60%, rgba(240,130,0,0.45), transparent 75%),

                /* Blue wave arcs */
                conic-gradient(
                    from 180deg at 50% 40%,
                    rgba(0,162,255,0.25),
                    transparent 40%,
                    rgba(255,180,70,0.25),
                    transparent 80%
                );

            filter: blur(140px);
            opacity: 0.75;
            animation: wavePulse 9s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes wavePulse {
            0% { opacity: 0.45; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.9; transform: translateX(-50%) scale(1.25); }
            100% { opacity: 0.45; transform: translateX(-50%) scale(1); }
        }

        .logo {
            max-width: 340px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter:
                drop-shadow(0 0 25px rgba(0,162,255,0.55))
                drop-shadow(0 0 18px rgba(255,180,70,0.55));
        }

        /* ------------------------------------
           GLASS CARD
        ------------------------------------ */
        .glass-card {
            max-width: 760px;
            margin: 3rem auto;
            padding: 2.5rem 2.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            text-align: center;
            box-shadow:
                0 0 25px rgba(0, 0, 0, 0.35),
                0 0 40px rgba(0,162,255,0.15),
                0 0 40px rgba(255,180,70,0.15);
        }

        .glass-card h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--highlight-blue);
            text-shadow: 0 0 12px rgba(0,162,255,0.55);
        }

        .glass-card p {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-mid);
        }

        /* ------------------------------------
           PREMIUM FOOTER — ORANGE ACCENTED
        ------------------------------------ */
        footer {
            margin-top: 6rem;
            padding: 3rem 1rem;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;

            background:
                radial-gradient(circle at 50% 120%, rgba(255,180,70,0.45), transparent 70%),
                radial-gradient(circle at 10% 0%, rgba(0,162,255,0.25), transparent 70%),
                conic-gradient(
                    from 0deg at 50% 80%,
                    rgba(0,162,255,0.25),
                    transparent 40%,
                    rgba(255,180,70,0.25),
                    transparent 80%
                ),
                linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.55));

            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 -10px 40px rgba(0, 0, 0, 0.45),
                0 -10px 60px rgba(0,162,255,0.15),
                0 -10px 60px rgba(255,180,70,0.15);
        }

        footer a {
            color: var(--highlight-blue);
            text-decoration: none;
            margin: 0 1rem;
            font-size: 1rem;
            transition: 0.25s ease;
            font-weight: 700;
        }

        footer a:hover {
            color: var(--bright-orange);
            text-shadow: 0 0 12px rgba(255,180,70,0.55);
        }
    </style>
</head>

<body>

    <!-- HERO SECTION -->
    <section class="hero">
        <img src="Businesslogo.png" alt="Coracle logo" class="logo">
    </section>

    <!-- GLASS CARD -->
    <div class="glass-card">
        <h2>A new app is coming soon</h2>
        <p>
            We’re building something designed to make travel simpler, clearer, and more connected.
            Stay tuned — Coracle’s new app is on the horizon.
        </p>
    </div>

    <!-- PREMIUM FOOTER -->
    <footer>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
        <a href="contact.html">Contact</a>
    </footer>

</body>
</html>
