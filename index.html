<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coracle</title>

    <!-- Orbitron Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-deep: #020814;
            --blue-core: rgb(0, 110, 190);
            --blue-glow: rgb(0, 162, 255);
            --blue-aqua: rgb(0, 180, 255);
            --orange-soft: rgba(255, 180, 70, 0.18);
            --text-light: #E6E6E6;
            --text-mid: #A8A8A8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: var(--navy-deep);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* ------------------------------------
           BACKGROUND WAVES + ENERGY RING
        ------------------------------------ */
        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 40%, var(--blue-core) 0%, transparent 55%),
                radial-gradient(circle at 50% 40%, var(--blue-glow) 0%, transparent 70%),
                radial-gradient(circle at 50% 40%, var(--orange-soft) 0%, transparent 85%),
                radial-gradient(circle at 30% 80%, rgba(0,110,190,0.25), transparent 70%),
                radial-gradient(circle at 70% 20%, rgba(0,180,255,0.25), transparent 70%),
                var(--navy-deep);
            filter: blur(40px);
        }

        /* Soft wave arcs */
        .wave-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(0,110,190,0.25), transparent 70%),
                radial-gradient(ellipse at 50% -20%, rgba(0,162,255,0.18), transparent 70%);
            filter: blur(60px);
            opacity: 0.7;
        }

        /* ------------------------------------
           HERO SECTION
        ------------------------------------ */
        .hero {
            text-align: center;
            padding: 8rem 1rem 4rem;
        }

        .logo {
            max-width: 340px;
            height: auto;
            filter:
                drop-shadow(0 0 25px rgba(0,162,255,0.45))
                drop-shadow(0 0 35px rgba(0,110,190,0.35));
        }

        /* ------------------------------------
           GLASS CARD
        ------------------------------------ */
        .glass-card {
            max-width: 760px;
            margin: 3rem auto;
            padding: 2.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        .glass-card h2 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--blue-aqua);
            text-shadow: 0 0 12px rgba(0,162,255,0.45);
        }

        .glass-card p {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-mid);
        }

        /* ------------------------------------
           FOOTER
        ------------------------------------ */
        footer {
            margin-top: 6rem;
            padding: 2.5rem 1rem;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-mid);
        }

        footer a {
            color: var(--blue-aqua);
            text-decoration: none;
            margin: 0 1rem;
            transition: 0.25s ease;
        }

        footer a:hover {
            color: var(--text-light);
            text-shadow: 0 0 10px rgba(0,162,255,0.45);
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="wave-layer"></div>

    <section class="hero">
        <img src="Businesslogo.png" alt="Coracle logo" class="logo">
    </section>

    <div class="glass-card">
        <h2>A new app is coming soon</h2>
        <p>
            We’re building something designed to make travel simpler, clearer, and more connected.
            Stay tuned — Coracle’s new app is on the horizon.
        </p>
    </div>

    <footer>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
        <a href="contact.html">Contact</a>
    </footer>

</body>
</html>
