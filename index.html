<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
    }

    .hero-image-wrap {
      width: 100%;
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .hero-bg {
      width: 100%;
      height: auto;
      display: block;
    }

    header {
      width: 100%;
      padding: 20px 270px 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .dropdown {
      position: relative;
    }

    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: #7fd1c8;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      position: relative;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav-button:hover {
      color: #ffffff;
      text-shadow: 0 0 6px rgba(127, 209, 200, 0.6);
    }

    .nav-button.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(127, 209, 200, 0.85);
    }

    .nav-button::after {
      content: "";
      position: absolute;
      left: 10%;
      bottom: -2px;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #ff7a18, #ffb347);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .nav-button:hover::after,
    .nav-button.active::after {
      width: 80%;
    }

    .contact-panel {
      position: absolute;
      top: 42px;
      right: 0;
      width: 260px;
      background: rgba(20, 30, 40, 0.96);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px;
      display: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      z-index: 1000;
    }

    .contact-panel.open {
      display: block;
    }

    .legal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }

    .legal-overlay.open {
      display: flex;
    }

    .legal-modal {
      width: min(980px, 100%);
      max-height: 88vh;
      background: rgba(12, 18, 24, 0.96);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .legal-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 14px;
    }

    .close-button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.16);
      color: #7fd1c8;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .legal-tabs {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      flex-wrap: wrap;
    }

    .legal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .legal-section {
      display: none;
    }

    .legal-section.active {
      display: block;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 768px) {

      /* Center the visible part of the logo (inside image) */
      .hero-bg {
        width: 100%;
        height: 90vh;
        object-fit: cover;
        object-position: top center;
      }

      /* Move nav to bottom */
      header {
        top: auto;
        bottom: 0;
        left: 0;
        width: 100%;
        justify-content: center;
        padding: 12px 16px;
      }

      header::before {
        inset: auto 0 0 0;
        height: 72px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
      }

      nav ul {
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-button {
        font-size: 13px;
        padding: 6px 10px;
      }

      /* Contact popup above bottom nav */
      .contact-panel {
        top: auto;
        bottom: 50px;
        right: 50%;
        transform: translateX(50%);
        width: min(260px, 90vw);
      }
    }
  </style>
</head>

<body>

  <div class="hero-image-wrap">
    <img src="newappweb4.png" class="hero-bg" alt="Coracle app">
  </div>

  <header>
    <nav>
      <ul>
        <li class="dropdown" id="contactDropdown">
          <button class="nav-button" id="contactBtn">Contact</button>
          <div class="contact-panel" id="contactPanel">
            <h3>Contact Coracle</h3>
            <p>Email us:</p>
            <a href="mailto:coracle1@btinternet.com">coracle1@btinternet.com</a>
          </div>
        </li>

        <li class="dropdown" id="legalDropdown">
          <button class="nav-button" id="legalBtn">Legal</button>
        </li>
      </ul>
    </nav>
  </header>

  <div class="legal-overlay" id="legalOverlay">
    <div class="legal-modal" id="legalModal">
      <div class="legal-modal-header">
        <h2>Legal</h2>
        <button class="close-button" id="closeLegalBtn">Close</button>
      </div>

      <div class="legal-tabs">
        <button id="privacyTab">Privacy</button>
        <button id="termsTab">Terms</button>
      </div>

      <div class="legal-body">
        <section id="privacySection" class="legal-section active">
          <h3>Privacy</h3>
          <p>Privacy content here...</p>
        </section>

        <section id="termsSection" class="legal-section">
          <h3>Terms</h3>
          <p>Terms content here...</p>
        </section>
      </div>
    </div>
  </div>

  <script>
    const contactBtn = document.getElementById("contactBtn");
    const contactPanel = document.getElementById("contactPanel");

    const legalBtn = document.getElementById("legalBtn");
    const legalOverlay = document.getElementById("legalOverlay");
    const closeLegalBtn = document.getElementById("closeLegalBtn");

    contactBtn.onclick = () => {
      contactPanel.classList.toggle("open");
    };

    legalBtn.onclick = () => {
      legalOverlay.classList.add("open");
    };

    closeLegalBtn.onclick = () => {
      legalOverlay.classList.remove("open");
    };
  </script>

</body>
</html>
