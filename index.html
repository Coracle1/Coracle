<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coracle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Orbitron Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy-deep: #020814;
            --blue-core: #006ebe;
            --blue-glow: #00a2ff;
            --blue-aqua: #00b4ff;
            --orange-soft: rgba(255, 180, 70, 0.18);
            --text-light: #E6E6E6;
            --text-mid: #A8A8A8;
            --card-bg: rgba(8, 16, 32, 0.9);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #4ade80;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: var(--navy-deep);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* BACKGROUND GLOW + WAVES */
        .background {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(circle at 50% 40%, var(--blue-core) 0%, transparent 55%),
                radial-gradient(circle at 50% 40%, var(--blue-glow) 0%, transparent 70%),
                radial-gradient(circle at 50% 40%, var(--orange-soft) 0%, transparent 85%),
                var(--navy-deep);
            filter: blur(40px);
        }

        .waves {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(0,110,190,0.25), transparent 70%),
                radial-gradient(ellipse at 80% 20%, rgba(0,162,255,0.18), transparent 70%),
                radial-gradient(ellipse at 50% 120%, rgba(0,180,255,0.18), transparent 70%);
            filter: blur(60px);
            opacity: 0.8;
        }

        /* APP LAYOUT */
        .app-shell {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 260px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .sidebar-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--blue-aqua);
            text-align: left;
        }

        .nav-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .nav-item {
            font-size: 0.95rem;
            color: var(--text-mid);
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-light);
        }

        /* MAIN CONTENT AREA */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 3rem;
        }

        .main-inner {
            display: flex;
            align-items: center;
            gap: 3rem;
            max-width: 980px;
            width: 100%;
        }

        /* CENTRAL LOGO + RING */
        .logo-wrap {
            position: relative;
            flex: 0 0 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ring {
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(0,162,255,0.5), transparent 65%),
                radial-gradient(circle, rgba(0,110,190,0.35), transparent 80%);
            filter: blur(18px);
        }

        .logo-core {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 20%, #ffffff 0%, #d0e9ff 25%, #005a9c 70%, #001020 100%);
            box-shadow:
                0 0 35px rgba(0,162,255,0.7),
                0 0 70px rgba(0,110,190,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-core img {
            width: 80%;
            height: auto;
            filter:
                drop-shadow(0 0 18px rgba(0,162,255,0.7))
                drop-shadow(0 0 28px rgba(0,110,190,0.6));
        }

        /* RIGHT CARD (VERBATIM LAYOUT, NEUTRAL TEXT) */
        .card {
            flex: 1;
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--card-border);
            padding: 1.8rem 1.6rem;
            box-shadow:
                0 18px 45px rgba(0,0,0,0.7),
                0 0 40px rgba(0,110,190,0.35);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.2rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-subtitle {
            font-size: 0.8rem;
            color: var(--text-mid);
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--accent-green);
        }

        .progress-bar {
            margin-top: 0.6rem;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #22c55e, #4ade80);
        }

        .task-list {
            margin-top: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .task-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--accent-green);
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="waves"></div>

    <div class="app-shell">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-title">Coracle</div>

            <nav class="nav-list">
                <div class="nav-item">Home</div>
                <div class="nav-item">Privacy Policy</div>
                <div class="nav-item">Contact</div>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main">
            <div class="main-inner">

                <!-- CENTRAL LOGO + RING -->
                <div class="logo-wrap">
                    <div class="logo-ring"></div>
                    <div class="logo-core">
                        <img src="Businesslogo.png" alt="Coracle logo">
                    </div>
                </div>

                <!-- RIGHT CARD (STRUCTURE LIKE SCREENSHOT, TEXT NEUTRAL) -->
                <section class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">Dashboard Overview</div>
                            <div class="card-subtitle">All actions completed</div>
                        </div>
                        <div class="progress-text">5 / 5 tasks completed</div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>

                    <div class="task-list">
                        <div class="task-item">
                            <div class="task-check">✓</div>
                            <span>Review account details</span>
                        </div>
                        <div class="task-item">
                            <div class="task-check">✓</div>
                            <span>Confirm notification settings</span>
                        </div>
                        <div class="task-item">
                            <div class="task-check">✓</div>
                            <span>Update security preferences</span>
                        </div>
                        <div class="task-item">
                            <div class="task-check">✓</div>
                            <span>Check upcoming reminders</span>
                        </div>
                        <div class="task-item">
                            <div class="task-check">✓</div>
                            <span>Save backup information</span>
                        </div>
                    </div>
                </section>

            </div>
        </main>

    </div>

</body>
</html>
