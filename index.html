<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coracle</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
    }

    body {
      position: relative;
    }

    .hero-image-wrap {
      width: 100%;
      position: relative;
      background: black;
      overflow: hidden;
    }

    .hero-bg-desktop,
    .hero-bg-mobile {
      width: 100%;
      display: block;
      height: auto;
    }

    .hero-bg-mobile {
      display: none;
    }

    header {
      width: 100%;
      padding: 20px 270px 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .dropdown {
      position: relative;
    }

    .nav-button {
      font-family: "Orbitron", sans-serif;
      color: #7fd1c8;
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      position: relative;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav-button:hover {
      color: #ffffff;
      text-shadow: 0 0 6px rgba(127, 209, 200, 0.6);
    }

    .nav-button.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(127, 209, 200, 0.85);
    }

    .nav-button::after {
      content: "";
      position: absolute;
      left: 10%;
      bottom: -2px;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #ff7a18, #ffb347);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .nav-button:hover::after,
    .nav-button.active::after {
      width: 80%;
    }

    .contact-panel {
      position: absolute;
      top: 42px;
      right: 0;
      width: 260px;
      background: rgba(20, 30, 40, 0.96);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px;
      display: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      z-index: 1000;
    }

    .contact-panel.open {
      display: block;
    }

    .contact-panel h3 {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .contact-panel p {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ddd;
      line-height: 1.5;
    }

    .contact-panel a,
    .contact-panel a:visited,
    .contact-panel a:hover {
      display: block;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      margin-top: 8px;
    }

    .contact-panel a:hover {
      text-decoration: underline;
    }

    .legal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2000;
    }

    .legal-overlay.open {
      display: flex;
    }

    .legal-modal {
      width: min(980px, 100%);
      max-height: 88vh;
      background: rgba(12, 18, 24, 0.96);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* CSS unchanged ... (kept exactly as you provided) */
  </style>
</head>

<body>

  <!-- HTML unchanged ... (exactly as you provided) -->

  <script>
    const contactBtn = document.getElementById("contactBtn");
    const contactPanel = document.getElementById("contactPanel");
    const contactDropdown = document.getElementById("contactDropdown");

    const legalBtn = document.getElementById("legalBtn");
    const legalOverlay = document.getElementById("legalOverlay");
    const legalModal = document.getElementById("legalModal");
    const legalDropdown = document.getElementById("legalDropdown");
    const closeLegalBtn = document.getElementById("closeLegalBtn");

    const privacyTab = document.getElementById("privacyTab");
    const termsTab = document.getElementById("termsTab");
    const privacySection = document.getElementById("privacySection");
    const termsSection = document.getElementById("termsSection");

    let contactTimeout = null;
    let legalTimeout = null;

    function cancelContactClose() {
      if (contactTimeout) {
        clearTimeout(contactTimeout);
        contactTimeout = null;
      }
    }

    function cancelLegalClose() {
      if (legalTimeout) {
        clearTimeout(legalTimeout);
        legalTimeout = null;
      }
    }

    function openContact() {
      cancelContactClose();
      closeLegalImmediate();
      contactPanel.classList.add("open");
      contactBtn.classList.add("active");
    }

    function closeContactImmediate() {
      cancelContactClose();
      contactPanel.classList.remove("open");
      contactBtn.classList.remove("active");
    }

    function scheduleContactClose() {
      cancelContactClose();
      contactTimeout = setTimeout(() => {
        closeContactImmediate();
      }, 180);
    }

    function openLegal() {
      cancelLegalClose();
      closeContactImmediate();
      legalOverlay.classList.add("open");
      legalBtn.classList.add("active");
    }

    function closeLegalImmediate() {
      cancelLegalClose();
      legalOverlay.classList.remove("open");
      legalBtn.classList.remove("active");
    }

    function scheduleLegalClose() {
      cancelLegalClose();
      legalTimeout = setTimeout(() => {
        closeLegalImmediate();
      }, 180);
    }

    function closeAllImmediate() {
      closeContactImmediate();
      closeLegalImmediate();
    }

    function showPrivacy() {
      privacyTab.classList.add("active");
      termsTab.classList.remove("active");
      privacySection.classList.add("active");
      termsSection.classList.remove("active");
    }

    function showTerms() {
      termsTab.classList.add("active");
      privacyTab.classList.remove("active");
      termsSection.classList.add("active");
      privacySection.classList.remove("active");
    }

    if (window.innerWidth > 1024) {
      contactDropdown.addEventListener("mouseenter", openContact);
      contactDropdown.addEventListener("mouseleave", scheduleContactClose);

      /* 🔥 FIX: removed hover for legal */
    }

    contactBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (contactPanel.classList.contains("open")) {
        closeContactImmediate();
      } else {
        openContact();
      }
    });

    legalBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (legalOverlay.classList.contains("open")) {
        closeLegalImmediate();
      } else {
        openLegal();
      }
    });

    privacyTab.addEventListener("click", showPrivacy);
    termsTab.addEventListener("click", showTerms);

    closeLegalBtn.addEventListener("click", closeLegalImmediate);

    legalOverlay.addEventListener("click", (e) => {
      if (!legalModal.contains(e.target)) {
        closeLegalImmediate();
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".dropdown") && !legalModal.contains(e.target)) {
        closeAllImmediate();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeAllImmediate();
      }
    });
  </script>

</body>
</html>
