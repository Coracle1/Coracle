<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Website Name</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: url("Newappweb.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      position: relative;
    }

    /* Dark overlay for readability */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 0;
    }

    /* Top navigation */
    header {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    nav a:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    /* Main content */
    main {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .hero {
      max-width: 900px;
      padding: 30px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      backdrop-filter: blur(4px);
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
        justify-content: center;
      }

      nav ul {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      nav a {
        font-size: 14px;
        padding: 6px 10px;
      }

      .hero h1 {
        font-size: 2rem;
      }

      .hero p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="privacy.html">Privacy</a></li>
        <li><a href="terms.html">Terms</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to My Website</h1>
      <p>
        Add your main homepage text here. This page uses your saved background image
        <strong>Newappweb.png</strong>, your favicon <strong>favicon.png</strong>,
        and includes links to your Contact, Privacy, and Terms pages at the top.
      </p>
    </section>
  </main>
</body>
</html>
